# Lakeflow Job: runs the full pipeline on day 1 of each month (Texas time).
# Notebook paths are relative to this file (Databricks Asset Bundles format).
resources:
  jobs:
    texas_water_pipeline:
      name: texas_water_pipeline
      schedule:
        quartz_cron_expression: 0 0 6 1 * ?
        timezone_id: America/Chicago
        pause_status: UNPAUSED
      tasks:
        - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/01_landing_download.ipynb
        - task_key: bronze
          depends_on:
            - task_key: landing
          notebook_task:
            notebook_path: ../notebooks/02_bronze.ipynb
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/03_silver.ipynb
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/04_gold.ipynb
      queue:
        enabled: true
      performance_target: STANDARD